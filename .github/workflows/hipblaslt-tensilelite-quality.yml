name: hipBLASLt tensilelite quality

# Report-only quality + AI-friendliness measurement for the hipBLASLt
# tensilelite Tensile/ Python tree. This job never gates merges: it always
# exits 0 and surfaces the metrics table via the run's job summary (no PR
# comments). Enforcement can be flipped on later by adding `--enforce`.

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - "projects/hipblaslt/tensilelite/**"
      - ".github/workflows/hipblaslt-tensilelite-quality.yml"
      # Docs-only negations: mirror the repo's `ci:docs-only` definition
      # (.github/labeler.yml -> {**/*.md,**/*.rst,**/docs/**/*,**/.readthedocs.yaml}).
      - "!**/*.md"
      - "!**/*.rst"
      - "!**/docs/**/*"
      - "!**/.readthedocs.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  quality:
    name: "tensilelite quality report"
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: projects/hipblaslt/tensilelite
          sparse-checkout-cone-mode: true
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lizard
        run: python -m pip install --disable-pip-version-check lizard

      - name: Run quality + AI-friendliness report
        # Report-only: always exits 0. The Markdown table is appended to the
        # run's job summary so it is visible without any PR comment.
        run: |
          python projects/hipblaslt/tensilelite/scripts/quality/check_quality.py \
            --summary-file "$GITHUB_STEP_SUMMARY"
